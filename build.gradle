plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.psoa.smbox'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

springBoot {
    mainClass = 'br.com.psoa.smbox.SmboxLauncher'
}

def javafxVersion = '25.0.4'
def javafxClassifier = {
	def os = System.getProperty('os.name').toLowerCase()
	def arch = System.getProperty('os.arch').toLowerCase()
	def isAarch64 = arch.contains('aarch64') || arch.contains('arm64')
	if (os.contains('win')) return isAarch64 ? 'win-aarch64' : 'win'
	if (os.contains('mac')) return isAarch64 ? 'mac-aarch64' : 'mac'
	return isAarch64 ? 'linux-aarch64' : 'linux'
}()

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-community-dialects'
	implementation 'org.xerial:sqlite-jdbc:3.45.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JavaFX, bundled as ordinary classpath deps (BOOT-INF/lib) rather than via jlink/module-path,
	// so Spring Boot's JarLauncher keeps working unmodified. Classifier picked by build-host OS;
	// mirrors the os.name branching used for the Tailwind CLI download below.
	implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxClassifier}"
	implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxClassifier}"
	implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxClassifier}"
	implementation "org.openjfx:javafx-media:${javafxVersion}:${javafxClassifier}"
	implementation "org.openjfx:javafx-web:${javafxVersion}:${javafxClassifier}"
}

tasks.named('test') {
	useJUnitPlatform()
}

def tailwindVersion = '3.4.19'
def tailwindCliDir = layout.buildDirectory.dir('tailwindcli').get().asFile
def tailwindCliBinaryName = { ->
	def os = System.getProperty('os.name').toLowerCase()
	def arch = System.getProperty('os.arch').toLowerCase()
	def isArm = arch.contains('aarch64') || arch.contains('arm')
	if (os.contains('win')) return 'tailwindcss-windows-x64.exe'
	if (os.contains('mac')) return isArm ? 'tailwindcss-macos-arm64' : 'tailwindcss-macos-x64'
	return isArm ? 'tailwindcss-linux-arm64' : 'tailwindcss-linux-x64'
}
def tailwindCliFile = { -> new File(tailwindCliDir, tailwindCliBinaryName()) }

tasks.register('downloadTailwindCli') {
	def cliFile = tailwindCliFile()
	outputs.file(cliFile)
	doLast {
		if (!cliFile.exists()) {
			tailwindCliDir.mkdirs()
			def url = "https://github.com/tailwindlabs/tailwindcss/releases/download/v${tailwindVersion}/${tailwindCliBinaryName()}"
			println "Downloading Tailwind CLI from ${url}"
			cliFile.bytes = URI.create(url).toURL().bytes
			cliFile.setExecutable(true)
		}
	}
}

tasks.register('buildTailwindCss', Exec) {
	dependsOn 'downloadTailwindCli'
	inputs.file('tailwind.config.js')
	inputs.file('src/main/tailwind/input.css')
	inputs.dir('src/main/resources/templates')
	def outputFile = file('src/main/resources/static/css/app.css')
	outputs.file(outputFile)
	commandLine tailwindCliFile().absolutePath,
		'-c', 'tailwind.config.js',
		'-i', 'src/main/tailwind/input.css',
		'-o', outputFile.absolutePath,
		'--minify'
}

tasks.named('processResources') {
	dependsOn 'buildTailwindCss'
}


bootJar {
	archiveFileName = "smbox-${version}.jar"
}

tasks.register('exportJar', Copy) {
	group = 'distribution'
	description = 'Builds the jar and copies it to a directory as smbox.jar (default: ~/app/smbox, override with -PexportDir=<path>)'
	dependsOn 'bootJar'
	def exportDir = project.hasProperty('exportDir') ? file(project.exportDir) : file("${System.getProperty('user.home')}/app/smbox")
	from bootJar.archiveFile
	into exportDir
	rename { 'smbox.jar' }
}

def appName = 'Smbox'
def appVersion = version.toString().replace('-SNAPSHOT', '')
def iconDir = file('packaging/icons')
def jpackageDestDir = layout.buildDirectory.dir('jpackage')
// Spring Boot 3.2+ loader launcher; verified against this project's built jar manifest.
def springBootLauncherMainClass = 'org.springframework.boot.loader.launch.JarLauncher'

// Eclipse Temurin 25 distributions ship without a jmods/ directory, so jpackage's default
// jlink-based runtime step fails with "This JDK does not support linking from the current
// run-time image". Point jpackage at the toolchain JDK's own install as a pre-built runtime
// image instead, which bypasses jlink entirely.
def jpackageJdkHome = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile.absolutePath

tasks.register('prepareJpackageInput', Copy) {
	dependsOn 'bootJar'
	from bootJar.archiveFile
	into layout.buildDirectory.dir('jpackage-input')
}

tasks.register('jpackageLinux', Exec) {
	group = 'distribution'
	description = 'Builds a Linux .deb installer using jpackage'
	dependsOn 'prepareJpackageInput'
	doFirst {
		def os = System.getProperty('os.name').toLowerCase()
		if (os.contains('win') || os.contains('mac')) {
			throw new GradleException('jpackageLinux must be run on a Linux machine/CI runner.')
		}
		jpackageDestDir.get().asFile.mkdirs()
	}
	commandLine 'jpackage',
		'--type', 'deb',
		'--input', layout.buildDirectory.dir('jpackage-input').get().asFile.absolutePath,
		'--main-jar', bootJar.archiveFileName.get(),
		'--main-class', springBootLauncherMainClass,
		'--name', appName,
		'--app-version', appVersion,
		'--icon', "${iconDir}/smbox.png",
		'--dest', jpackageDestDir.get().asFile.absolutePath,
		'--runtime-image', jpackageJdkHome,
		'--linux-shortcut',
		'--linux-menu-group', 'Office',
		'--vendor', 'psoa'
}

tasks.register('jpackageWindows', Exec) {
	group = 'distribution'
	description = 'Builds a Windows .msi installer using jpackage (must run ON Windows)'
	dependsOn 'prepareJpackageInput'
	doFirst {
		if (!System.getProperty('os.name').toLowerCase().contains('win')) {
			throw new GradleException('jpackageWindows must be run on a Windows machine/CI runner.')
		}
		jpackageDestDir.get().asFile.mkdirs()
	}
	commandLine 'jpackage',
		'--type', 'msi',
		'--input', layout.buildDirectory.dir('jpackage-input').get().asFile.absolutePath,
		'--main-jar', bootJar.archiveFileName.get(),
		'--main-class', springBootLauncherMainClass,
		'--name', appName,
		'--app-version', appVersion,
		'--icon', "${iconDir}/smbox.ico",
		'--dest', jpackageDestDir.get().asFile.absolutePath,
		'--runtime-image', jpackageJdkHome,
		'--win-menu',
		'--win-shortcut',
		'--win-dir-chooser',
		'--vendor', 'psoa'
}
